<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- FileCollector 符号化图标 (GNOME HIG ui-icons):
       16x16 画布, 2px 主笔画, 像素网格对齐, 单色 (GTK 按 alpha 重着色)。
       缩自主应用图标 io.github.sam_fic.filecollector.svg:
       圆角窗口 + 顶部突出的收集输入条 (原橙色, 最具辨识度的元素) + 渐短文本行。
       16px 下绿色对勾圆章笔画不足 1px, 依 HIG "single distinguishing property" 舍弃。
       注释须位于 <svg> 标签之后: gdk-pixbuf/flatpak build-export 靠文件开头
       的 "<svg" 探测 SVG 格式, 前置注释会导致 "Format not recognized"。 -->
  <g fill="#bebebe">
    <rect x="4" y="2" width="8" height="2" rx="1"/>
    <rect x="4" y="6" width="7" height="2"/>
    <rect x="4" y="9" width="4" height="2"/>
  </g>
  <rect x="2" y="4" width="12" height="9" rx="1" fill="none" stroke="#bebebe" stroke-width="2"/>
</svg>
